name: ESP32-CAM firmware checks

on:
  push:
    branches: [main]
    paths:
      - "firmware/esp32_cam/**"
      - "docs/ble_protocol.json"
      - ".github/workflows/esp32-firmware-check.yml"
  pull_request:
    paths:
      - "firmware/esp32_cam/**"
      - "docs/ble_protocol.json"
      - ".github/workflows/esp32-firmware-check.yml"
  workflow_dispatch:

jobs:
  compile-esp32cam:
    name: Compile AI Thinker ESP32-CAM firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install firmware libraries
        run: arduino-cli lib install "ArduinoJson@7.4.2"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam \
            --warnings all \
            firmware/esp32_cam
