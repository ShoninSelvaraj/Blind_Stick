name: blindstick_companion
description: BlindStick Companion accessible companion app for a smart navigation stick.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  flutter_blue_plus: ^1.35.5
  flutter_map: ^8.3.2
  http: ^1.6.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
